<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580">
  <defs>
    <linearGradient id="bgWin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bgVM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="960" height="580" fill="#0b0f17"/>

  <!-- TITLE -->
  <text x="480" y="30" fill="#e2e8f0" font-size="18" font-family="Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">AGENTGUI — Architecture Map (2026-06-16)</text>

  <!-- WINDOWS HOST BOX -->
  <rect x="20" y="50" width="920" height="260" rx="8" fill="url(#bgWin)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="40" y="78" fill="#38bdf8" font-size="14" font-family="Segoe UI, sans-serif" font-weight="bold">🖥️ WINDOWS HOST (GPU)</text>

  <!-- ImageAnimator Service -->
  <rect x="40" y="95" width="430" height="195" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="55" y="118" fill="#22d3ee" font-size="12" font-weight="bold">ImageAnimator Service — Port 5021</text>
  <text x="55" y="140" fill="#94a3b8" font-size="10" font-family="monospace">engines/image_animator_service.py</text>
  <rect x="55" y="155" width="400" height="120" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="65" y="175" fill="#e2e8f0" font-size="10">Endpoints:</text>
  <text x="75" y="192" fill="#a5f3fc" font-size="9" font-family="monospace">POST /api/media/upload</text>
  <text x="75" y="207" fill="#a5f3fc" font-size="9" font-family="monospace">POST /api/video/animate</text>
  <text x="75" y="222" fill="#a5f3fc" font-size="9" font-family="monospace">GET  /api/video/status/&lt;job&gt;</text>
  <text x="75" y="237" fill="#a5f3fc" font-size="9" font-family="monospace">GET  /api/video/download/&lt;job&gt;</text>
  <text x="75" y="252" fill="#a5f3fc" font-size="9" font-family="monospace">GET  /api/video/effects</text>
  <text x="75" y="267" fill="#a5f3fc" font-size="9" font-family="monospace">GET  /api/media/file/&lt;fn&gt;</text>

  <!-- ComfyUI -->
  <rect x="490" y="95" width="430" height="80" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="505" y="118" fill="#a78bfa" font-size="12" font-weight="bold">ComfyUI — Port 8188</text>
  <text x="505" y="140" fill="#94a3b8" font-size="10" font-family="monospace">GPU text-to-image generation</text>
  <text x="505" y="158" fill="#c4b5fd" font-size="9" font-family="monospace">http://192.168.0.187:8188</text>

  <!-- Effects Engine -->
  <rect x="490" y="185" width="430" height="105" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="505" y="208" fill="#fbbf24" font-size="12" font-weight="bold">Effects Engine — core/image_animator.py</text>
  <text x="505" y="228" fill="#fde68a" font-size="9" font-family="monospace">fog | god_rays | fireflies | particles | ken_burns | pulse_light</text>
  <text x="505" y="243" fill="#fde68a" font-size="9" font-family="monospace">lightning | rain (speed 20) | snow | ripple | lightning_bolt</text>
  <text x="505" y="268" fill="#94a3b8" font-size="9">⚠ Needs restart after edits: python -B engines\image_animator_service.py</text>

  <!-- LAN LABEL -->
  <rect x="440" y="340" width="80" height="24" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="480" y="356" fill="#22d3ee" font-size="10" font-weight="bold" text-anchor="middle">LAN 192.168.0.x</text>

  <!-- ARROWS -->
  <polygon points="460,380 470,395 450,395" fill="#22d3ee"/>
  <line x1="460" y1="310" x2="460" y2="395" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- VM BOX -->
  <rect x="20" y="395" width="920" height="170" rx="8" fill="url(#bgVM)" stroke="#a3e635" stroke-width="2" filter="url(#shadow)"/>
  <text x="40" y="423" fill="#a3e635" font-size="14" font-family="Segoe UI, sans-serif" font-weight="bold">💻 WSL VM (Ubuntu)</text>

  <!-- VM Server -->
  <rect x="40" y="440" width="430" height="110" rx="6" fill="#27272a" stroke="#84cc16" stroke-width="1.5"/>
  <text x="55" y="463" fill="#84cc16" font-size="12" font-weight="bold">VM server.py — Port 5020</text>
  <text x="55" y="485" fill="#d4d4d8" font-size="10" font-family="monospace">Flask + Socket.IO — Agents / Tasks / MediaPool</text>
  <text x="55" y="510" fill="#fca5a5" font-size="10">❌ ZERO ImageAnimator code (removed lines 1254-1504)</text>
  <text x="55" y="535" fill="#94a3b8" font-size="9">Dependencies: core/state.py, core/runner.py, psutil</text>

  <!-- React Frontend -->
  <rect x="490" y="440" width="430" height="110" rx="6" fill="#27272a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="505" y="463" fill="#38bdf8" font-size="12" font-weight="bold">React Frontend (build → static/)</text>
  <text x="505" y="485" fill="#d4d4d8" font-size="10" font-family="monospace">src/components/ImageAnimator.jsx → API_BASE = 192.168.0.187:5021</text>
  <text x="505" y="510" fill="#a5f3fc" font-size="10">Features: drag-drop upload, dynamic sliders, job polling, download</text>
  <text x="505" y="535" fill="#94a3b8" font-size="9">Build: /home/xlybris/projects/react-frontend → cp -r dist/* static/</text>

  <!-- LEGEND -->
  <rect x="740" y="55" width="190" height="28" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="755" y="74" fill="#fbbf24" font-size="10" font-weight="bold">Next: Restart service + test effects</text>
</svg>